# casper-container base compose definition
#
# Do not run podman compose directly; use ./casper.sh instead.
# All variables come from .generated/.env generated by casper.sh;
# user-defined mounts/ports live in .generated/compose.override.yml.

# podman-compose puts services in a pod by default, but pods cannot be used with userns keep-id
x-podman:
  in_pod: false

services:
  casper:
    image: casper-toolflow:${TOOLFLOW_VERSION}
    build:
      context: .
      dockerfile: versions/${TOOLFLOW_VERSION}/Dockerfile
      args:
        BASE_IMAGE: ${BASE_IMAGE}
        TOOLFLOW_VERSION: ${TOOLFLOW_VERSION}
        VIVADO_VERSION: ${VIVADO_VERSION}
        MINICONDA_INSTALLER: ${MINICONDA_INSTALLER}
        PYTHON_VERSION: ${PYTHON_VERSION}
        CONDA_ENV_NAME: ${CONDA_ENV_NAME}
        MLIB_DEVEL_REPO: ${MLIB_DEVEL_REPO}
        MLIB_DEVEL_BRANCH: ${MLIB_DEVEL_BRANCH}
        DEVICE_TREE_XLNX_REPO: ${DEVICE_TREE_XLNX_REPO}
        DEVICE_TREE_XLNX_BRANCH: ${DEVICE_TREE_XLNX_BRANCH}
        GIT_CLONE_DEPTH: ${GIT_CLONE_DEPTH}
        SCILAB_VERSION: ${SCILAB_VERSION}
        SCILAB_URL: ${SCILAB_URL}
        CONTAINER_USER: ${CONTAINER_USER}
        USER_UID: ${HOST_UID}
        USER_GID: ${HOST_GID}
    container_name: ${CONTAINER_NAME}
    hostname: ${CONTAINER_HOSTNAME}
    # pasta networking (generated by casper.sh, e.g. pasta:-I,eth0,--ns-mac-addr,<MAC>)
    # Port forwarding still uses the ports below; podman hands them to pasta
    network_mode: ${PASTA_NETWORK}
    # Map the host user UID/GID into the container as-is so mounted directories are writable
    userns_mode: keep-id
    # The entrypoint needs root to set passwords and start sshd
    user: root
    # Do not SELinux-relabel mounted directories (avoid relabeling the Vivado install)
    security_opt:
      - label=disable
    shm_size: ${SHM_SIZE}
    environment:
      VIVADO_DIR: ${VIVADO_DIR}
      CONTAINER_PWD: ${CONTAINER_PWD}
      VNC_PASSWORD: ${VNC_PASSWORD}
      VNC_GEOMETRY: ${VNC_GEOMETRY}
      TZ: ${TZ}
    volumes:
      # Vivado is mounted at the same path as on the host
      - ${VIVADO_DIR}:${VIVADO_DIR}:${VIVADO_MOUNT_OPTS}
      - ${XIL_LICENSE_DIR}:/home/${CONTAINER_USER}/.Xilinx
      - ${WORK_DIR}:/home/${CONTAINER_USER}/work
    ports:
      - ${BIND_ADDRESS}:${SSH_PORT}:22
      - ${BIND_ADDRESS}:${VNC_PORT}:5901
    restart: unless-stopped
