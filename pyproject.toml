[project]
name = "casperbox"
version = "0.2.3"
description = "Build and run CASPER toolflow (and plain dev) containers with rootless podman"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
]

[project.scripts]
casperbox = "casperbox.cli:main"
casperbox-dev = "casperbox.cli:main_dev"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/casperbox"]

[tool.pytest.ini_options]
testpaths = ["tests"]
