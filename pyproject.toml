[project]
name = "casper-container"
version = "0.2.0"
description = "Build and run CASPER toolflow development containers with rootless podman"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
]

[project.scripts]
casper = "casper_container.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/casper_container"]

[tool.pytest.ini_options]
testpaths = ["tests"]
