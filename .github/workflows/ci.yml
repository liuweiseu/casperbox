name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Python code: lint + unit tests
  # ---------------------------------------------------------------------------
  lint:
    name: Lint (ruff, shellcheck)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: ruff
        run: uvx ruff check src tests
      - name: shellcheck
        run: |
          uvx --from shellcheck-py shellcheck \
            src/casperbox/assets/common/scripts/*.sh \
            src/casperbox/assets/common/rootfs/usr/local/bin/entrypoint.sh \
            src/casperbox/assets/dev/*.sh \
            src/casperbox/assets/versions/*/patch/*.sh \
            tests/smoke/*.sh

  unit-tests:
    name: Unit tests (Python ${{ matrix.python }})
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run pytest -v
      - name: CLI starts
        run: |
          uv run casperbox --version
          uv run casperbox list
          uv run casperbox-dev --version
          uv run casperbox-dev list

  # ---------------------------------------------------------------------------
  # Containers: build and start them with real rootless podman, then check that
  # SSH, VNC, an extra port, mounts and the MAC address work (tests/smoke/smoke.sh)
  # ---------------------------------------------------------------------------
  dev-container:
    name: casperbox-dev container (${{ matrix.os }})
    needs: [lint, unit-tests]
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu:20.04", "ubuntu:22.04", "ubuntu:24.04", "ubuntu:26.04"]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-podman
      - name: Smoke test
        # GitHub's Azure Ubuntu mirror: fast from the runners, and tests build.apt_mirror
        env:
          SMOKE_APT_MIRROR: http://azure.archive.ubuntu.com/ubuntu
        run: tests/smoke/smoke.sh casperbox-dev --os "${{ matrix.os }}"

  toolflow-container:
    name: casperbox container (m2021a)
    needs: [lint, unit-tests]
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    steps:
      - name: Free disk space (the toolflow image is large)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-podman
      - name: Smoke test
        env:
          SMOKE_APT_MIRROR: http://azure.archive.ubuntu.com/ubuntu
        run: tests/smoke/smoke.sh casperbox
