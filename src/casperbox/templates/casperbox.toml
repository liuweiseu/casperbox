# casperbox configuration
# Generated by `casperbox init`. Relative paths are relative to this file's directory.

# Toolflow version (see `casperbox list`)
version = "$version"

[container]
# Container name; change it to run several containers side by side.
# The hostname inside the container is the same as the name.
name = "casper-$version"
user = "casper"            # container user (rebuild the image after changing)
password = "casper"        # SSH / sudo password
vnc_password = "casper"    # 6-8 characters
mac = ""                   # MAC of eth0, e.g. "02:42:ac:11:00:02"; empty = random
shm_size = "2g"
tz = "UTC"

[vivado]
# Vivado install directory, mounted at the same path in the container.
# Either the Xilinx root (with Vivado/$vivado_version/settings64.sh) or the Vivado dir itself.
dir = "/tools/Xilinx"
mount = "ro"               # ro | rw

[paths]
license_dir = "~/.Xilinx"  # -> ~/.Xilinx in the container
work_dir = "./work"        # -> ~/work in the container (created if missing)

[ports]
bind_address = "0.0.0.0"   # 127.0.0.1 = local access only
ssh = 2222                 # -> container 22
vnc = 5901                 # -> container 5901

[vnc]
geometry = "1920x1080"

[build]
# apt mirror used to build the image (also kept in the image for `sudo apt` in the container).
# Replaces archive.ubuntu.com and security.ubuntu.com; empty = default Ubuntu servers.
# Set it if those servers are slow or unreachable from your network, e.g.
#   apt_mirror = "http://us.archive.ubuntu.com/ubuntu"
#   apt_mirror = "http://mirrors.ocf.berkeley.edu/ubuntu"
# Changing it rebuilds the image on the next `up`.
apt_mirror = ""

# Optional extra mounts (repeat the block for more)
# [[mounts]]
# host = "~/datasets"
# container = "~/datasets"   # ~/ = container user's home
# mode = "ro"                # ro | rw, default rw

# Optional extra ports (repeat the block for more)
# [[extra_ports]]
# host = 8888
# container = 8888
# protocol = "tcp"           # tcp | udp, default tcp
