# casperbox-dev configuration
# Generated by `casperbox-dev init`. Relative paths are relative to this file's directory.
#
# Layout: what you are likely to change comes first (the base OS, the container, its network and
# ports, the mounted directories). What goes into the image (apt mirror, packages, apt repositories
# and tools) comes last.

# -----------------------------------------------------------------------------
# Base OS of the image
#
# Any apt-based image (Ubuntu / Debian) in the form "name:tag"; the tag is required.
# Recommended: "ubuntu:26.04" (latest Ubuntu LTS). Tested images: `casperbox-dev list`.
# Other apt-based images (e.g. "ubuntu:24.04", "debian:13") also work, with a warning.
# Non-apt images (alpine, fedora, ...) are not supported.
#
# Finding a valid image name and tag:
#   - Docker Hub: https://hub.docker.com/_/ubuntu (see the "Tags" tab),
#     https://hub.docker.com/_/debian for Debian
#   - Command line: podman search --list-tags docker.io/library/ubuntu
# Short names like "ubuntu:26.04" mean docker.io/library/ubuntu:26.04;
# images from other registries need the full name, e.g. "quay.io/org/image:tag".
# -----------------------------------------------------------------------------
os = "$os"

[container]
# Container name; change it to run several containers side by side.
# The hostname inside the container is the same as the name.
name = "$name"
user = "casper"            # container user
password = "casper"        # SSH / sudo password
vnc_password = "casper"    # 6-8 characters
mac = ""                   # MAC of eth0, e.g. "02:42:ac:11:00:02"; empty = random (ignored with network.mode = "host")
shm_size = "2g"            # for GPU workloads (e.g. PyTorch data loaders) use e.g. "32g"
tz = "UTC"
# Resource limits, e.g. on a server shared by several users. Empty / 0 = no limit.
# They need cgroup v2 with the controllers delegated to users; `up` checks this.
memory = ""                # RAM limit, e.g. "64g" (no swap on top of it)
cpus = 0                   # CPU time quota, e.g. 16
cpuset = ""                # CPU cores, e.g. "0-15"; better than cpus for Vivado (nproc shows only these)
# NVIDIA GPUs passed into the container: "0", "0,1" or "all"; empty = none.
# Needs nvidia-container-toolkit and a CDI spec on the host (`up` checks both and tells you how).
# The GPUs are fixed when the container is created: change this, then `casperbox-dev up` recreates it.
gpus = ""
# RDMA devices passed into the container; empty = none (for hosts without an RDMA NIC).
# See "Using an RDMA NIC" at the end of this file for everything an RDMA NIC needs.
rdma = ""                  # "all", or device names from `ibv_devices` on the host, e.g. "mlx5_0,mlx5_1"

[network]
# pasta: the container has its own network (user-space, a few Gbit/s); only the ports below are
#        published on the host. The default.
# host:  the container shares the host's network: every NIC is available at full speed (100G
#        iperf3, UDP data streams, RDMA with rdma_cm, ...) with the host's IP and MAC addresses.
#        SSH and VNC then listen on the host's ports below, on bind_address only; to keep them off
#        the fast NIC, set bind_address to the IP or the interface name of the management NIC
#        (e.g. "eno1"). [[extra_ports]] and container.mac have no effect in this mode.
#        The VNC display :1 must be free on the host.
mode = "pasta"

[ports]
# Where SSH and VNC listen on the host: an IP address, or a network interface name such as "eno1"
# (`up` looks up its current IPv4 address). 0.0.0.0 = every NIC; 127.0.0.1 = local access only.
bind_address = "0.0.0.0"
ssh = 0                    # -> container 22; 0 = `up` picks the first free port from 2222
vnc = 0                    # -> container 5901; 0 = `up` picks the first free port from 5901
                           # (a picked port is written back here)

[vnc]
geometry = "1920x1080"

# No directories are mounted by default; add the ones you need (repeat the block for more)
# [[mounts]]
# host = "~/projects"
# container = "~/projects"   # ~/ = container user's home
# mode = "rw"                # ro | rw, default rw

# Optional extra ports (repeat the block for more)
# [[extra_ports]]
# host = 8888
# container = 8888
# protocol = "tcp"           # tcp | udp, default tcp

# -----------------------------------------------------------------------------
# What goes into the image
#
# Changing anything below rebuilds the image on the next `up`. The image always has:
# openssh-server, TigerVNC, XFCE desktop, Firefox, sudo, curl.
# -----------------------------------------------------------------------------
[build]
# apt mirror used to build the image (also kept in the image for `sudo apt` in the container).
# Replaces archive.ubuntu.com and security.ubuntu.com; empty = default Ubuntu servers.
# Set it if those servers are slow or unreachable from your network, e.g.
#   apt_mirror = "http://us.archive.ubuntu.com/ubuntu"
#   apt_mirror = "http://mirrors.ocf.berkeley.edu/ubuntu"
apt_mirror = ""

# Extra apt packages installed into the image; packages from the third-party repositories below
# go here too. (`packages` may also stand at the top of the file, before [container].)
packages = [
    # "git",
    # "vim",
    # "python3-pip",
]

# Third-party apt repositories, added before the packages are installed (repeat the block
# for more). Take the values from the vendor's install instructions:
#   deb [signed-by=...] <url> <suite> <components...>   and the key URL from its curl command.
# [[apt_repos]]
# name = "yazi"              # file names: /etc/apt/sources.list.d/<name>.sources, /etc/apt/keyrings/<name>.*
# key = "https://yazi-rs.github.io/builds/yazi-keyring.gpg"   # https; binary or ASCII-armored
# url = "https://yazi-rs.github.io/builds/"
# suite = "stable"           # default: the OS codename (e.g. noble); "./" for a flat repository
# components = ["main"]      # default ["main"]; none for a flat repository
# key_fingerprint = ""       # optional: the key's fingerprint as published by the vendor

# -----------------------------------------------------------------------------
# Tools that are not apt packages
#
# Each [[tools]] block installs one tool with a shell script, run with bash while the image is
# built. Use it for what apt does not have: release tarballs from GitHub, vendor install scripts,
# per-user setup (dotfiles, pip install --user, ...).
#
#   name    lowercase letters, digits, '.', '_', '-'; must be unique
#   version optional; passed to the script as $$VERSION (pin it, or e.g. "latest" if the script handles it)
#   run_as  "root" (default) or "user" (the container user, with HOME set and ~/.local/bin on PATH)
#   script  the commands; write them in '''...''' (a literal string), so backslashes and $$ are kept
#
# Order: all run_as = "root" tools run first, then the run_as = "user" ones, each group in the
# order written here, so a tool can rely on the ones above it.
# A script runs with `set -euo pipefail`: any failing command stops the build (with its output).
# A script sees: $$VERSION, $$DEB_ARCH (amd64 | arm64), $$CONTAINER_USER and $$HOME.
# Changing a script or a version rebuilds the image on the next `up`. Remove the leading '# ' of
# a block to use it; add your own blocks the same way.
# -----------------------------------------------------------------------------
# [[tools]]
# name = "lazygit"
# version = "0.65.1"         # part of the download name, so it is pinned here
# script = '''
# case "$$DEB_ARCH" in
#     amd64) arch=x86_64 ;;
#     arm64) arch=arm64 ;;
#     *) echo "unsupported architecture: $$DEB_ARCH" >&2; exit 1 ;;
# esac
# tarball="lazygit_$${VERSION}_linux_$${arch}.tar.gz"
# cd /tmp
# curl -fsSLO "https://github.com/jesseduffield/lazygit/releases/download/v$${VERSION}/$${tarball}"
# tar -xzf "$${tarball}" -C /usr/local/bin --no-same-owner lazygit
# rm -f "$${tarball}"
# lazygit --version          # a last check that the tool works
# '''
#
# [[tools]]
# name = "shell-aliases"
# run_as = "user"            # runs as the container user, after all root tools
# script = '''
# cat >> "$$HOME/.bashrc" <<'BASHRC'
# alias ll='ls -alF'
# alias lg='lazygit'
# BASHRC
# '''

# -----------------------------------------------------------------------------
# Using an RDMA NIC (InfiniBand or RoCE, e.g. ConnectX-5/6/7)
#
# The default config is for hosts without one. To use an RDMA NIC in the container:
#
#  1. On the host: the driver (MLNX_OFED, or the kernel's mlx5_ib and ib_uverbs modules) must be
#     loaded: `ibv_devices` lists the device names (mlx5_0, ...) and /dev/infiniband/ exists.
#     The hard locked-memory limit of your user must be unlimited, because RDMA pins memory
#     (the administrator sets it once):
#       printf '* soft memlock unlimited\n* hard memlock unlimited\n' \
#         | sudo tee /etc/security/limits.d/90-rdma.conf        # then log in again
#  2. In [container]: rdma = "all", or the device names, e.g. rdma = "mlx5_0,mlx5_1".
#     This passes /dev/infiniband/uverbs* (and rdma_cm, umad* when you may use them) into the
#     container and adds the IPC_LOCK capability and an unlimited memlock. `up` checks all of it.
#  3. In `packages` (at the top), add the user-space libraries and tools:
#       "rdma-core", "ibverbs-utils", "rdmacm-utils", "perftest", "infiniband-diags"
#     (ibv_devinfo, ib_write_bw, ibstat, ...; add "iperf3" and "ethtool" for TCP/IP tests).
#  4. In [network]: leave mode = "pasta" for programs that use verbs only (ib_write_bw, NCCL).
#     Set mode = "host" if they use rdma_cm (`ib_write_bw -R`, IP-based MPI), or to use the fast NIC
#     with plain TCP/UDP (iperf3, data streams) at full speed; then point ports.bind_address at the
#     management NIC so SSH and VNC are not opened on the fast one.
#
# InfiniBand or RoCE (Ethernet) is a property of the NIC; nothing here depends on it.
# Check inside the container: ibv_devinfo, ibstat, ib_write_bw (a server on one machine,
# `ib_write_bw <server>` on the other), iperf3 -c <server> -P 8.
# -----------------------------------------------------------------------------
