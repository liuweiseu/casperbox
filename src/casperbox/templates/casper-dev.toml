# casperbox-dev configuration
# Generated by `casperbox-dev init`. Relative paths are relative to this file's directory.

# -----------------------------------------------------------------------------
# Base OS of the image
#
# Any apt-based image (Ubuntu / Debian) in the form "name:tag"; the tag is required.
# Recommended: "ubuntu:26.04" (latest Ubuntu LTS). Tested images: `casperbox-dev list`.
# Other apt-based images (e.g. "ubuntu:24.04", "debian:13") also work, with a warning.
# Non-apt images (alpine, fedora, ...) are not supported.
#
# Finding a valid image name and tag:
#   - Docker Hub: https://hub.docker.com/_/ubuntu (see the "Tags" tab),
#     https://hub.docker.com/_/debian for Debian
#   - Command line: podman search --list-tags docker.io/library/ubuntu
# Short names like "ubuntu:26.04" mean docker.io/library/ubuntu:26.04;
# images from other registries need the full name, e.g. "quay.io/org/image:tag".
# -----------------------------------------------------------------------------
os = "$os"

# Extra apt packages installed into the image (changing this list rebuilds the image).
# The image always has: openssh-server, TigerVNC, XFCE desktop, Firefox, sudo, curl.
packages = [
    # "git",
    # "vim",
    # "python3-pip",
]

[container]
# Container name; change it to run several containers side by side.
# The hostname inside the container is the same as the name.
name = "$name"
user = "casper"            # container user
password = "casper"        # SSH / sudo password
vnc_password = "casper"    # 6-8 characters
mac = ""                   # MAC of eth0, e.g. "02:42:ac:11:00:02"; empty = random
shm_size = "2g"
tz = "UTC"
# Resource limits, e.g. on a server shared by several users. Empty / 0 = no limit.
# They need cgroup v2 with the controllers delegated to users; `up` checks this.
memory = ""                # RAM limit, e.g. "64g" (no swap on top of it)
cpus = 0                   # CPU time quota, e.g. 16
cpuset = ""                # CPU cores, e.g. "0-15"; better than cpus for Vivado (nproc shows only these)

[ports]
bind_address = "0.0.0.0"   # 127.0.0.1 = local access only
ssh = 2322                 # -> container 22
vnc = 5902                 # -> container 5901

[vnc]
geometry = "1920x1080"

[build]
# apt mirror used to build the image (also kept in the image for `sudo apt` in the container).
# Replaces archive.ubuntu.com and security.ubuntu.com; empty = default Ubuntu servers.
# Set it if those servers are slow or unreachable from your network, e.g.
#   apt_mirror = "http://us.archive.ubuntu.com/ubuntu"
#   apt_mirror = "http://mirrors.ocf.berkeley.edu/ubuntu"
# Changing it rebuilds the image on the next `up`.
apt_mirror = ""

# No directories are mounted by default; add the ones you need (repeat the block for more)
# [[mounts]]
# host = "~/projects"
# container = "~/projects"   # ~/ = container user's home
# mode = "rw"                # ro | rw, default rw

# Optional extra ports (repeat the block for more)
# [[extra_ports]]
# host = 8888
# container = 8888
# protocol = "tcp"           # tcp | udp, default tcp
