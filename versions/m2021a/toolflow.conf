# =============================================================================
# CASPER toolflow m2021a 版本定义
#
# !!! 本文件由仓库维护者管理，请勿修改 !!!
# 修改后 casper.sh 会因校验和不匹配而拒绝构建/启动。
# 维护者修改后需执行 tools/update-checksums.sh 更新 versions/SHA256SUMS。
# =============================================================================

TOOLFLOW_VERSION=m2021a

# 基础镜像（使用完整名称，避免 podman 短名称解析提示）
BASE_IMAGE=docker.io/library/ubuntu:20.04

# Vivado 版本：容器内路径为 /tools/Xilinx/Vivado/${VIVADO_VERSION}
VIVADO_VERSION=2021.1

# Python / conda
MINICONDA_INSTALLER=Miniconda3-latest-Linux-x86_64.sh
PYTHON_VERSION=3.8
CONDA_ENV_NAME=casper

# mlib_devel
MLIB_DEVEL_REPO=https://github.com/casper-astro/mlib_devel.git
MLIB_DEVEL_BRANCH=m2021a

# device-tree-xlnx（mlib_devel 通过 XLNX_DT_REPO_PATH 使用）
DEVICE_TREE_XLNX_REPO=https://github.com/Xilinx/device-tree-xlnx.git
DEVICE_TREE_XLNX_BRANCH=xlnx_rel_v2021.1

# git 克隆深度（0 表示完整历史）
GIT_CLONE_DEPTH=1

# Scilab
SCILAB_VERSION=6.1.1
SCILAB_URL=https://www.scilab.org/download/6.1.1/scilab-6.1.1.bin.linux-x86_64.tar.gz
